name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoiceflow
          POSTGRES_PASSWORD: invoiceflow
          POSTGRES_DB: invoiceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceflow -d invoiceflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://invoiceflow:invoiceflow@localhost:5432/invoiceflow_test
      TEST_DATABASE_URL: postgresql+psycopg://invoiceflow:invoiceflow@localhost:5432/invoiceflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check that the models and migrations agree
        run: alembic check
      - name: Run tests against PostgreSQL
        run: pytest
      - name: Check that migrations can be reversed and re-applied
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (tests, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test the running API
        run: bash scripts/smoke_test.sh
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
